<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" role="img" aria-label="Scatter of neurodegeneration targets by distinct compounds with measured activity against liganded PDB structures, both on log scales. Sortilin sits at the low-data corner but above the minimum structural threshold, while progranulin itself has zero liganded structures.">
      <g font-family="ui-sans-serif, -apple-system, sans-serif" font-size="11.5" fill="#6B7280">

        <!-- gridlines -->
        <g stroke="#6B7280" opacity=".14">
          <line x1="90" y1="50" x2="90" y2="280"/>
          <line x1="420" y1="50" x2="420" y2="280"/>
          <line x1="751" y1="50" x2="751" y2="280"/>
          <line x1="90" y1="280" x2="850" y2="280"/>
          <line x1="90" y1="195" x2="850" y2="195"/>
          <line x1="90" y1="110" x2="850" y2="110"/>
        </g>

        <!-- threshold -->
        <line x1="90" y1="220" x2="850" y2="220" stroke="#8A6516" stroke-width="1.4" stroke-dasharray="5 4"/>
        <text x="846" y="234" text-anchor="end" font-size="10.5" fill="#8A6516">5 liganded structures — below this there is nothing to dock into</text>

        <!-- axis labels -->
        <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" opacity=".6">
          <text x="90" y="298" text-anchor="middle">100</text>
          <text x="420" y="298" text-anchor="middle">1,000</text>
          <text x="751" y="298" text-anchor="middle">10,000</text>
          <text x="80" y="284" text-anchor="end">1</text>
          <text x="80" y="199" text-anchor="end">10</text>
          <text x="80" y="114" text-anchor="end">100</text>
        </g>
        <text x="470" y="322" text-anchor="middle" font-size="11.5" opacity=".8">distinct compounds with measured activity (log)</text>
        <text x="26" y="165" text-anchor="middle" font-size="11.5" opacity=".8" transform="rotate(-90 26 165)">liganded PDB entries (log)</text>

        <!-- comparator points -->
        <g fill="#6B7280" opacity=".55">
          <circle cx="780" cy="59" r="5"/>
          <circle cx="784" cy="166" r="5"/>
          <circle cx="663" cy="142" r="5"/>
          <circle cx="647" cy="166" r="5"/>
          <circle cx="622" cy="208" r="5"/>
          <circle cx="583" cy="208" r="5"/>
          <circle cx="539" cy="142" r="5"/>
          <circle cx="411" cy="203" r="5"/>
        </g>
        <g font-size="11" opacity=".78">
          <text x="770" y="63" text-anchor="end">BACE1</text>
          <text x="774" y="170" text-anchor="end">GBA1</text>
          <text x="663" y="131" text-anchor="middle">LRRK2</text>
          <text x="637" y="170" text-anchor="end">CSF1R</text>
          <text x="632" y="212" text-anchor="start">CTSD</text>
          <text x="573" y="212" text-anchor="end">CTSB</text>
          <text x="539" y="131" text-anchor="middle">CTSL</text>
          <text x="411" y="192" text-anchor="middle">OGA</text>
        </g>

        <!-- SORT1 -->
        <circle cx="136" cy="208" r="9" fill="none" stroke="#7C89E8" stroke-width="1.4" opacity=".55"/>
        <circle cx="136" cy="208" r="5.5" fill="#7C89E8"/>
        <text x="150" y="205" font-size="12" fill="#7C89E8" font-weight="600">SORT1</text>
        <text x="150" y="221" font-size="10.5" fill="#7C89E8" opacity=".85">138 cpds · 6–7 structures</text>

        <!-- GRN annotation -->
        <text x="90" y="344" font-size="11" fill="#A33A2E">GRN (progranulin itself): 0 liganded structures — off scale. This is why the program targets the clearance receptor, not the protein.</text>
      </g>
    </svg>
