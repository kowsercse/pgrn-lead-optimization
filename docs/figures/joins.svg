<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Two cross-source joins. A patent series scaffold matched to a co-crystal ligand yields a chemotype-matched receptor. An InChIKey set difference between a ChEMBL set and a PubChem assay yields a prospective holdout with no overlap.">
      <defs>
        <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 z" fill="#6B7280"/>
        </marker>
      </defs>
      <g font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" fill="#6B7280">

        <text x="14" y="20" font-size="11" font-family="ui-monospace, Menlo, monospace" opacity=".6">JOIN 1 — SCAFFOLD MATCH</text>

        <rect x="14" y="34" width="222" height="50" rx="3" fill="none" stroke="#6B7280" stroke-width="1.2"/>
        <text x="28" y="55" font-size="11.5">Patent series core</text>
        <text x="28" y="72" font-size="10.5" opacity=".7" font-family="ui-monospace, Menlo, monospace">5,5-dimethyl-L-norleucine</text>

        <rect x="14" y="98" width="222" height="50" rx="3" fill="none" stroke="#6B7280" stroke-width="1.2"/>
        <text x="28" y="119" font-size="11.5">Co-crystal ligand</text>
        <text x="28" y="136" font-size="10.5" opacity=".7" font-family="ui-monospace, Menlo, monospace">UP4 in PDB 6X48</text>

        <circle cx="330" cy="91" r="27" fill="none" stroke="#7C89E8" stroke-width="1.6"/>
        <text x="330" y="96" text-anchor="middle" font-size="15" fill="#7C89E8">≡</text>

        <rect x="416" y="62" width="250" height="58" rx="3" fill="none" stroke="#7C89E8" stroke-width="1.8"/>
        <text x="432" y="86" fill="#7C89E8" font-size="11.5">Receptor chemotype-matched</text>
        <text x="432" y="104" fill="#7C89E8" font-size="11.5">to the series being scored</text>

        <g stroke="#6B7280" stroke-width="1.2" fill="none" marker-end="url(#b1)">
          <path d="M236,59 C280,59 280,80 300,84"/>
          <path d="M236,123 C280,123 280,102 300,98"/>
          <line x1="357" y1="91" x2="410" y2="91"/>
        </g>
        <text x="700" y="86" font-size="11" opacity=".7">docking a series into a</text>
        <text x="700" y="102" font-size="11" opacity=".7">structure of its own chemotype</text>

        <line x1="14" y1="176" x2="886" y2="176" stroke="#6B7280" opacity=".2"/>

        <text x="14" y="204" font-size="11" font-family="ui-monospace, Menlo, monospace" opacity=".6">JOIN 2 — POOL SOURCES ON INCHIKEY</text>

        <rect x="14" y="218" width="222" height="50" rx="3" fill="none" stroke="#6B7280" stroke-width="1.2"/>
        <text x="28" y="239" font-size="11.5">public measured set</text>
        <text x="28" y="256" font-size="10.5" opacity=".7" font-family="ui-monospace, Menlo, monospace">ChEMBL</text>

        <rect x="14" y="278" width="222" height="44" rx="3" fill="none" stroke="#6B7280" stroke-width="1.2"/>
        <text x="28" y="297" font-size="11.5">patent-deposited set</text>
        <text x="28" y="313" font-size="10.5" opacity=".7" font-family="ui-monospace, Menlo, monospace">additional compounds</text>

        <circle cx="330" cy="270" r="27" fill="none" stroke="#7C89E8" stroke-width="1.6"/>
        <text x="330" y="276" text-anchor="middle" font-size="14" fill="#7C89E8">∪</text>

        <rect x="416" y="242" width="250" height="58" rx="3" fill="none" stroke="#7C89E8" stroke-width="1.8"/>
        <text x="432" y="266" fill="#7C89E8" font-size="11.5">One pooled set,</text>
        <text x="432" y="284" fill="#7C89E8" font-size="11.5">no double-counting</text>

        <g stroke="#6B7280" stroke-width="1.2" fill="none" marker-end="url(#b1)">
          <path d="M236,243 C280,243 280,258 300,263"/>
          <path d="M236,300 C280,300 280,282 300,277"/>
          <line x1="357" y1="270" x2="410" y2="270"/>
        </g>
        <text x="700" y="266" font-size="11" opacity=".7">every source counted, none</text>
        <text x="700" y="282" font-size="11" opacity=".7">counted twice</text>
      </g>
    </svg>
