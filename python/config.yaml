# PGRN-Sortilin screening pipeline — runtime configuration.
# Loaded by workflows/config.py; override the file path with PGRN_CONFIG_PATH.

llm_model: anthropic/claude-sonnet-4-6

target:
  gene_a: GRN # progranulin
  gene_b: SORT1 # sortilin
  # Real Sortilin-Progranulin co-crystal structures (RCSB PDB).
  pdb_ids: ["6X48", "6X4H", "6X3L"]
  # Tool compounds co-crystallized in the structures above — seeds for ligand mining.
  known_ligand_names: ["Compound 17", "Compound 24", "Compound 2"]

structure_prediction:
  # Used only when structure_agent falls back from fetch_pdb_structure (no experimental structure).
  engine: boltz2 # boltz2 | chai1 | alphafold3 | rf3
  use_msa: true
  recycling_steps: 3
  sampling_steps: 200
  diffusion_samples: 1

interface:
  ligand_contact_cutoff_angstrom: 4.5
  pocket_expand_residues: 0
  # Crystallographic waters, glycans, and common cryoprotectants/buffer/ion additives —
  # excluded so pocket detection isn't polluted by non-drug-like heteroatoms. Per-target
  # inhibitor codes (e.g. 6X48/6X4H/6X3L's bound compounds) are deliberately NOT listed
  # here so they remain the detected "ligand"; extend this list per target as needed.
  exclude_resnames:
    ["HOH", "GOL", "PEG", "EDO", "DMS", "MPD", "NAG", "BMA", "MAN", "FUC", "GAL", "SIA", "NA", "CL", "MG", "CA", "ZN", "K", "SO4", "PO4"]

ligand_mining:
  pubchem_query_field: name # name | smiles | cid

odesign:
  # Generative screening (spec/fixes_0.md) — replaces the old static-library assemble+dock flow.
  num_generations: 50
  population_size: 10
  dock_every_n_generations: 10 # only dock every Nth generation (Vina is the expensive step)
  affinity_best_kcal_mol: -12.0 # Vina affinities map onto a 0-1 scale between these two bounds
  affinity_worst_kcal_mol: -4.0
  score_weights:
    model_score: 0.4 # ODesign's own predicted binding-affinity/complementarity score
    docking_score: 0.4 # Vina affinity (only present on docked generations)
    ligand_similarity: 0.2 # similarity to the known-ligand seeds

docking:
  engine: vina
  exhaustiveness: 8
  num_poses: 9
  energy_range: 3.0
  seed: 42
  reference_ligand_padding_angstrom: 4.0
  positive_control_rank_threshold_pct: 10.0 # controls must land in the top X% by score to "pass" validation

hit_triage:
  pains_filter: true
  diversity_cluster_cutoff: 0.4 # Butina clustering distance cutoff (1 - Tanimoto)
  top_n: 50

admet:
  provider: rdkit_proxy
  lipinski_violations_max: 1
  qed_min: 0.3

prioritization:
  weights:
    docking_score: 0.5
    admet: 0.3
    diversity: 0.2
  top_n: 20
  benchling:
    enabled: false # flip true once BENCHLING_CLIENT_ID/BENCHLING_CLIENT_SECRET + tenant schema IDs are confirmed
    base_url: https://hackathon.bnchdev.org
    entity_schema_id: null # Benchling custom-entity schema ID for shortlist compounds
    results_folder_id: null # Benchling folder ID to file new entities under
